# Pipeline TicketFlow : build + tests + analyse SonarCloud (Quality Gate bloquante)
#
# Variables à définir dans GitLab (Settings > CI/CD > Variables) :
#   SONAR_TOKEN         (masked)  token généré sur SonarCloud
#   SONAR_ORGANIZATION            clé de l'organisation SonarCloud
#   SONAR_PROJECT_KEY             clé du projet SonarCloud

stages:
  - test
  - analyse

# Pipelines uniquement sur les merge requests et sur la branche par défaut
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

# ---------------------------------------------------------------- Backend
.backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-25
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - cd backend/$SERVICE
    # verify = compile + tests + rapport JaCoCo (target/site/jacoco/jacoco.xml)
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - backend/$SERVICE/target/classes
      - backend/$SERVICE/target/site/jacoco/jacoco.xml
    reports:
      junit: backend/$SERVICE/target/surefire-reports/TEST-*.xml

test:auth-service:
  extends: .backend-test
  variables:
    SERVICE: auth-service

test:event-service:
  extends: .backend-test
  variables:
    SERVICE: event-service
    # Le contexte Spring d'event-service démarre Liquibase : il lui faut une base Postgres
    POSTGRES_DB: eventdb
    POSTGRES_USER: ticketflow
    POSTGRES_PASSWORD: ticketflow
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventdb
  services:
    - name: postgres:16
      alias: postgres

# --------------------------------------------------------------- Frontend
test:frontend:
  stage: test
  image: node:24
  cache:
    key:
      files:
        - frontend/ticketflow-web/package-lock.json
    paths:
      - frontend/ticketflow-web/.npm/
  script:
    - cd frontend/ticketflow-web
    - npm ci --cache .npm --prefer-offline
    - npx ng test --watch=false --coverage --coverage-reporters=lcov
    - npx ng build
    # Sonar résout les chemins du lcov depuis la racine du repo : on préfixe les chemins relatifs
    - sed -i -E '/^SF:(\/|frontend\/)/! s#^SF:#SF:frontend/ticketflow-web/#' coverage/*/lcov.info
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - frontend/ticketflow-web/coverage/

# -------------------------------------------------------------- SonarCloud
sonarcloud:
  stage: analyse
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - test:auth-service
    - test:event-service
    - test:frontend
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"   # historique complet, nécessaire à SonarCloud (blame, code neuf)
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - >
      sonar-scanner
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.organization=$SONAR_ORGANIZATION
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.qualitygate.wait=true
