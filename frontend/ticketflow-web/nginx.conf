server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Application Angular (SPA) : toute URL inconnue (/evenements, /events/new...)
    # renvoie index.html, et c'est le routeur Angular qui affiche la bonne page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers JS/CSS générés par Angular : leur nom change à chaque build, on peut les garder longtemps en cache
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
