<dialog
  #dialog
  class="app-dialog"
  [attr.data-tone]="dialogs.current()?.tone"
  aria-labelledby="app-dialog-title"
  aria-describedby="app-dialog-message"
  (cancel)="onCancel($event)"
>
  @if (dialogs.current(); as current) {
    <h2 id="app-dialog-title">
      @if (current.tone === 'error') { <span aria-hidden="true">⚠️ </span> }
      {{ current.title }}
    </h2>
    <p id="app-dialog-message">{{ current.message }}</p>

    <div class="app-dialog__actions">
      <!-- "Retour" en PREMIER : c'est lui qui reçoit le focus, le choix le plus sûr par défaut -->
      @if (current.cancelLabel) {
        <button type="button" class="secondary" (click)="dialogs.close(false)">{{ current.cancelLabel }}</button>
      }
      <button type="button" class="primary" (click)="dialogs.close(true)">{{ current.confirmLabel }}</button>
    </div>
  }
</dialog>
