<section class="hero" aria-labelledby="hero-title">
  <h1 id="hero-title">Trouvez votre prochain événement</h1>
  <p class="hero__subtitle">Concerts, théâtre, conférences : réservez vos places en quelques clics.</p>

  @if (authService.isLoggedIn()) {
    <p class="hero__greeting">Bonjour {{ authService.getUsername() }}</p>
    <div class="hero__actions">
      <a class="hero__button hero__button--primary" href="#evenements">Voir les événements</a>
    </div>
  } @else {
    <div class="hero__actions">
      <button type="button" class="hero__button hero__button--primary" (click)="authService.register()">
        Créer un compte
      </button>
      <button type="button" class="hero__button hero__button--secondary" (click)="authService.login()">
        Se connecter
      </button>
    </div>
    <a class="hero__link" href="#evenements">Parcourir les événements sans compte</a>
  }
</section>
