<main>
  <h2>Événements disponibles</h2>

  <div class="search-bar">
    <label for="search-title">Rechercher</label>
    <input id="search-title" type="text" [formControl]="searchControl" placeholder="Titre de l'événement..." />

    <label for="search-location">Lieu</label>
    <input id="search-location" type="text" [formControl]="locationControl" placeholder="Ville, salle..." />

    <label>
      <input type="checkbox" [formControl]="availableOnlyControl" />
      Places disponibles uniquement
    </label>
  </div>

  @if (authService.hasRole('ADMIN')) {
    <a routerLink="/events/new" class="create-link">Créer un nouvel événement</a>
  }

  @if (errorMessage()) {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }

  @if (eventService.events$().length === 0) {
    <p role="status">Aucun événement pour l'instant.</p>
  } @else {
    <ul class="event-list" role="list">
      @for (event of eventService.events$(); track event.id) {
        <li>
          <app-event-card [event]="event" (reserve)="reserve(event.id, $event)" />
        </li>
      }
    </ul>
  }
</main>
