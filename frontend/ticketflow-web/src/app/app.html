<header class="app-header">
  <a class="app-logo" routerLink="/">TicketFlow</a>

  <nav class="app-nav" aria-label="Navigation principale">
    <a
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >Accueil</a>
    <a
      routerLink="/evenements"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >Événements</a>
    @if (authService.hasRole('ADMIN')) {
      <a
        routerLink="/admin"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >Tableau de bord</a>
    }
  </nav>

  <div class="app-auth">
    @if (authService.isLoggedIn()) {
      <span class="user-info">Connecté : {{ authService.getUsername() }}</span>
      <button type="button" (click)="authService.logout()">Se déconnecter</button>
    } @else {
      <button type="button" (click)="authService.register()">S'inscrire</button>
      <button type="button" (click)="authService.login()">Se connecter</button>
    }
  </div>
</header>
<app-notification-banner />

<router-outlet />
