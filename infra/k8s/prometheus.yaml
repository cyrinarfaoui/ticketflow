# Prometheus : la configuration est la MÊME que pour Docker Compose (infra/prometheus/prometheus.yml).
# Elle est fournie par la ConfigMap "prometheus-config", créée depuis ce fichier par deploy.sh.
# Les cibles (event-service:8080…) fonctionnent telles quelles : les Services portent les mêmes noms.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus          # contient prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ticketflow
spec:
  type: LoadBalancer        # http://localhost:9090
  selector:
    app: prometheus
  ports:
    - port: 9090
