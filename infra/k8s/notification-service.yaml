# notification-service (WebFlux + SSE) : même modèle qu'event-service.yaml (voir ses commentaires)
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: ticketflow
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  EVENT_SERVICE_URL: http://event-service:8080   # WebClient : détails de l'événement
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: infra-notification-service:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: notification-service-config
          ports:
            - containerPort: 8083
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 5
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ticketflow
spec:
  selector:
    app: notification-service
  ports:
    - port: 8083
