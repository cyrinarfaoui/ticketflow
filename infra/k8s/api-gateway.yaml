# api-gateway : seul point d'entrée de l'API, publié sur http://localhost:8000 (comme avec Docker Compose)
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ticketflow
data:
  # Dans Kubernetes, les services s'appellent par le nom de leur Service (DNS du cluster)
  EVENT_SERVICE_URL: http://event-service:8080
  AUTH_SERVICE_URL: http://auth-service:8082
  NOTIFICATION_SERVICE_URL: http://notification-service:8083
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/ticketflow
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
  APP_CORS_ALLOWED_ORIGIN: http://ticketflow.localhost
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: infra-api-gateway:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: api-gateway-config
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8000 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticketflow
spec:
  type: LoadBalancer        # publié sur http://localhost:8000
  selector:
    app: api-gateway
  ports:
    - port: 8000
