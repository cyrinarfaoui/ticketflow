# Kafka en mode KRaft (sans ZooKeeper), un seul nœud : suffisant en local.
# En production : 3 brokers minimum, des disques persistants (ou l'opérateur Strimzi).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes ajoute à chaque Pod des variables sur les Services voisins, dont KAFKA_PORT=tcp://…
      # L'image apache/kafka prend toute variable KAFKA_* pour un réglage : le broker refuserait de démarrer
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:19092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:19092" }   # l'adresse donnée aux clients : le Service
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          ports:
            - containerPort: 19092
          readinessProbe:               # prêt quand le port Kafka accepte les connexions
            tcpSocket:
              port: 19092
            periodSeconds: 5
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka                     # le nom que cherchent les services : "kafka:19092"
  namespace: ticketflow
spec:
  selector:
    app: kafka
  ports:
    - port: 19092