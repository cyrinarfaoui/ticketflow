services:
  postgres-event-service:
    image: postgres:16
    container_name: ticketflow-postgres-event
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ticketflow-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  postgres_event_data:
  keycloak_data: