services:
  postgres-event-service:
    image: postgres:16
    container_name: ticketflow-postgres-event
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data
  postgres-payment-service:
    image: postgres:16
    container_name: ticketflow-postgres-payment
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ticketflow-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  kafka:
    image: apache/kafka:4.0.0
    container_name: ticketflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


  ticketflow-web:
    build:
      context: ../frontend/ticketflow-web
      dockerfile: Dockerfile.dev
    container_name: ticketflow-web
    volumes:
      - ../frontend/ticketflow-web:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - event-service
      - keycloak

  event-service:
    build: ../backend/event-service
    container_name: ticketflow-event-service
    depends_on:
      - mailpit
      - postgres-event-service
      - keycloak
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-event-service:5432/eventdb
      SPRING_DATASOURCE_USERNAME: ticketflow
      SPRING_DATASOURCE_PASSWORD: ticketflow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/ticketflow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGIN: http://localhost:4200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MAIL_HOST: mailpit        # e-mails d'annulation (ticket #17)
      MAIL_PORT: 1025
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8080:8080"

  # Faux serveur e-mail : reçoit les e-mails (SMTP 1025) et les affiche sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ticketflow-mailpit
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP

  auth-service:
    build: ../backend/auth-service
    container_name: ticketflow-auth-service
    depends_on:
      - keycloak
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/ticketflow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8082:8082"

  notification-service:
    build: ../backend/notification-service
    container_name: ticketflow-notification-service
    depends_on:
      - kafka
      - event-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EVENT_SERVICE_URL: http://event-service:8080   # WebClient : détails de l'événement (ticket #5)
    ports:
      - "8083:8083"

  payment-service:
    build: ../backend/payment-service
    container_name: ticketflow-payment-service
    depends_on:
      - postgres-payment-service
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment-service:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: ticketflow
      SPRING_DATASOURCE_PASSWORD: ticketflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"

  api-gateway:
    build: ../backend/api-gateway
    container_name: ticketflow-api-gateway
    depends_on:
      - event-service
      - auth-service
      - notification-service
      - keycloak
    environment:
      # Dans Docker, les services s'appellent par leur NOM (la "découverte" de Docker Compose)
      EVENT_SERVICE_URL: http://event-service:8080
      AUTH_SERVICE_URL: http://auth-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      # Le jeton contient l'émetteur "localhost:8081" (vu par le navigateur)…
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/ticketflow
      # … mais DANS Docker, les clés publiques de Keycloak se récupèrent via son nom de conteneur
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ticketflow/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGIN: http://localhost:4200
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8000:8000"



volumes:
  postgres_event_data:
  keycloak_data:
  postgres_payment_data: