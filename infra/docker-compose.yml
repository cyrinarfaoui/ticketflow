services:
  postgres-event-service:
    image: postgres:16
    container_name: ticketflow-postgres-event
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data


  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ticketflow-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  sonarqube:
    image: sonarqube:community
    container_name: ticketflow-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  event-service:
    build: ../backend/event-service
    container_name: ticketflow-event-service
    depends_on:
      - postgres-event-service
      - keycloak
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-event-service:5432/eventdb
      SPRING_DATASOURCE_USERNAME: ticketflow
      SPRING_DATASOURCE_PASSWORD: ticketflow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/ticketflow
      APP_CORS_ALLOWED_ORIGIN: http://localhost:4200
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8080:8080"

  auth-service:
    build: ../backend/auth-service
    container_name: ticketflow-auth-service
    depends_on:
      - keycloak
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/ticketflow
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8082:8082"

volumes:
  postgres_event_data:
  keycloak_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: