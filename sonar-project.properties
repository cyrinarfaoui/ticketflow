# Un seul projet SonarCloud pour tout le monorepo.
# sonar.organization et sonar.projectKey sont passés par la CI (variables GitLab).

sonar.sources=backend/auth-service/src/main/java,backend/event-service/src/main/java,frontend/ticketflow-web/src
sonar.tests=backend/auth-service/src/test/java,backend/event-service/src/test/java,frontend/ticketflow-web/src
sonar.test.inclusions=backend/**/src/test/**/*.java,frontend/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/target/**,**/*.spec.ts

# Java : classes compilées par les jobs test:* + couverture JaCoCo
sonar.java.binaries=backend/auth-service/target/classes,backend/event-service/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/auth-service/target/site/jacoco/jacoco.xml,backend/event-service/target/site/jacoco/jacoco.xml

# Angular : couverture lcov produite par `ng test --coverage`
sonar.javascript.lcov.reportPaths=frontend/ticketflow-web/coverage/**/lcov.info
