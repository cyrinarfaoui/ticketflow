# =====================================================================
#  SonarCloud : un seul projet pour tout le monorepo TicketFlow
# =====================================================================
sonar.organization=cyrine-projects
sonar.projectKey=cyrine-projects_ticketflow
sonar.projectName=TicketFlow

# ---------- Code analysé ----------
sonar.sources=backend/auth-service/src/main/java,\
  backend/event-service/src/main/java,\
  backend/notification-service/src/main/java,\
  frontend/ticketflow-web/src
sonar.tests=backend/auth-service/src/test/java,\
  backend/event-service/src/test/java,\
  backend/notification-service/src/test/java,\
  frontend/ticketflow-web/src
sonar.test.inclusions=backend/**/src/test/**/*.java,frontend/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/target/**,**/*.spec.ts

# ---------- Java : code compilé + couverture JaCoCo ----------
sonar.java.binaries=backend/auth-service/target/classes,\
  backend/event-service/target/classes,\
  backend/notification-service/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/auth-service/target/site/jacoco/jacoco.xml,\
  backend/event-service/target/site/jacoco/jacoco.xml,\
  backend/notification-service/target/site/jacoco/jacoco.xml

# ---------- Angular : couverture Karma ----------
sonar.javascript.lcov.reportPaths=frontend/ticketflow-web/coverage/ticketflow-web/lcov.info