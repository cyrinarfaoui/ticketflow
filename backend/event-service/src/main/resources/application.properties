spring.application.name=event-service

app.cors.allowed-origin=http://localhost:4200

spring.datasource.url=jdbc:postgresql://localhost:5432/eventdb
spring.datasource.username=ticketflow
# The password is NEVER stored in code: it comes from the environment
# variable SPRING_DATASOURCE_PASSWORD (docker-compose, GitLab CI, Kubernetes Secret).
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schema est gere exclusivement par Liquibase ; Hibernate se contente de verifier la coherence
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ticketflow

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Un client ne peut pas demander plus de 100 éléments par page (protection contre ?size=1000000)
spring.data.web.pageable.max-page-size=100

# Consommateur : résultats de paiement (saga) payment.completed / payment.failed → PaymentResultMessage
spring.kafka.consumer.group-id=event-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ticketflow.event_service.infrastructure.messaging.PaymentResultMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ticketflow.event_service.infrastructure.messaging
