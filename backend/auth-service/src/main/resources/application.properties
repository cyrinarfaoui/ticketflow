spring.application.name=auth-service
server.port=8082

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ticketflow

# Observabilité : seuls la santé et les mesures sont exposées (pas /env, /beans… qui révèlent la configuration)
management.endpoints.web.exposure.include=health,prometheus
# Chaque mesure porte le nom du service : on les distingue dans Prometheus et Grafana
management.metrics.tags.application=${spring.application.name}
