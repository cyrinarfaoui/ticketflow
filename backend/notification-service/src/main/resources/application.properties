spring.application.name=notification-service
server.port=8083

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ticketflow.notification_service.infrastructure.messaging.ReservationCreatedMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ticketflow.notification_service.infrastructure.messaging

# URL d'event-service (en Docker : EVENT_SERVICE_URL=http://event-service:8080)
app.event-service.url=${EVENT_SERVICE_URL:http://localhost:8080}

# Observabilité : seuls la santé et les mesures sont exposées (pas /env, /beans… qui révèlent la configuration)
management.endpoints.web.exposure.include=health,prometheus
# Chaque mesure porte le nom du service : on les distingue dans Prometheus et Grafana
management.metrics.tags.application=${spring.application.name}
