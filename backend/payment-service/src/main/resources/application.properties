spring.application.name=payment-service
server.port=8084

# ---------- Base de données propre au service ----------
spring.datasource.url=jdbc:postgresql://localhost:5433/paymentdb
spring.datasource.username=ticketflow
# Le mot de passe n'est JAMAIS dans le code : variable d'environnement SPRING_DATASOURCE_PASSWORD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092

# Consommateur : reservation.created (JSON → ReservationCreatedMessage)
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ticketflow.payment_service.infrastructure.messaging.ReservationCreatedMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ticketflow.payment_service.infrastructure.messaging

# Producteur : payment.completed / payment.failed (PaymentResultMessage → JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Observabilité : seuls la santé et les mesures sont exposées (pas /env, /beans… qui révèlent la configuration)
management.endpoints.web.exposure.include=health,prometheus
# Chaque mesure porte le nom du service : on les distingue dans Prometheus et Grafana
management.metrics.tags.application=${spring.application.name}
